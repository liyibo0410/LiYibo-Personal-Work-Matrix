<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img"
     aria-label="云枢智能 CloudPivot —— AI 电商运营中台：十个 AI 能力模块，合并成一套统一系统（深色版）"
     font-family="'Microsoft YaHei','PingFang SC',Inter,-apple-system,'Segoe UI',sans-serif">

  <title>云枢智能 CloudPivot · AI 电商运营中台（深色版）</title>
  <desc>深色版头图，与 banner.svg 同构同文案。底色 #151A23、面 #1E2430、线 #2C3442、主文本 #F2F5F9、次文本 #A7B0BE，强调色仍为 #3370FF。右侧为 L3→L0 四层架构色块，底部左侧为跨模块真实调用与 ADR 条数，右侧为仓库地址。封面不含任何入口地址。</desc>

  <!-- 深色底色 -->
  <rect width="1280" height="320" fill="#151A23"/>

  <!-- 极淡网格纹理：64px 栅格，纯几何、无渐变 -->
  <path d="M64 0V320M128 0V320M192 0V320M256 0V320M320 0V320M384 0V320M448 0V320M512 0V320M576 0V320M640 0V320M704 0V320M768 0V320M832 0V320M896 0V320M960 0V320M1024 0V320M1088 0V320M1152 0V320M1216 0V320M0 64H1280M0 128H1280M0 192H1280M0 256H1280"
        fill="none" stroke="#2C3442" stroke-width="1" opacity="0.8"/>

  <!-- 顶部强调色标线 -->
  <rect width="1280" height="4" fill="#3370FF"/>

  <!-- 右侧：L0→L3 四层架构色块（与浅色版同色，保证两版同构） -->
  <g>
    <text x="764" y="54" text-anchor="end" font-size="11" fill="#A7B0BE">架构分层</text>
    <rect x="780" y="206" width="460" height="30" rx="8" fill="#98A2B3"/>
    <rect x="780" y="162" width="420" height="30" rx="8" fill="#85ACFF"/>
    <rect x="780" y="118" width="380" height="30" rx="8" fill="#5A8AFF"/>
    <rect x="780" y="74" width="340" height="30" rx="8" fill="#3370FF"/>
    <text x="764" y="226" text-anchor="end" font-size="13" fill="#A7B0BE">L0 数据中台</text>
    <text x="764" y="182" text-anchor="end" font-size="13" fill="#A7B0BE">L1 模型微调</text>
    <text x="764" y="138" text-anchor="end" font-size="13" fill="#A7B0BE">L2 能力层</text>
    <text x="764" y="94" text-anchor="end" font-size="13" fill="#A7B0BE">L3 应用层</text>
  </g>

  <!-- 左侧：品牌标 -->
  <rect x="56" y="72" width="64" height="64" rx="16" fill="#3370FF"/>
  <text x="88" y="114" text-anchor="middle" font-size="26" font-weight="700" letter-spacing="1" fill="#FFFFFF">CP</text>

  <!-- 左侧：标题与副标题 -->
  <text x="144" y="119" font-size="42" font-weight="700" fill="#F2F5F9">云枢智能 CloudPivot</text>
  <text x="144" y="153" font-size="18" fill="#A7B0BE">AI 电商运营中台 · 十个 AI 能力模块，一套统一系统</text>

  <!-- 左侧：四项实测事实胶囊 -->
  <rect x="56" y="181" width="86" height="36" rx="9" fill="#1E2430" stroke="#2C3442"/>
  <text x="73" y="204" font-size="14" fill="#F2F5F9">10 模块</text>
  <rect x="152" y="181" width="92" height="36" rx="9" fill="#1E2430" stroke="#2C3442"/>
  <text x="169" y="204" font-size="14" fill="#F2F5F9">4 层架构</text>
  <rect x="254" y="181" width="114" height="36" rx="9" fill="#1E2430" stroke="#2C3442"/>
  <text x="271" y="204" font-size="14" fill="#F2F5F9">15 受管进程</text>
  <rect x="378" y="181" width="112" height="36" rx="9" fill="#1E2430" stroke="#2C3442"/>
  <text x="395" y="204" font-size="14" fill="#F2F5F9">731 passed</text>

  <!-- 页脚：分隔线 + 实测事实 + 仓库地址（封面一律不放入口 URL / IP / 端口） -->
  <line x1="56" y1="256" x2="1240" y2="256" stroke="#2C3442" stroke-width="1"/>
  <text x="56" y="291" font-size="13" fill="#A7B0BE">四个跨模块真实调用 · 6 条 ADR</text>
  <text x="1240" y="291" text-anchor="end" font-size="13" fill="#A7B0BE">github.com/liyibo0410/yunshu-ai-portfolio</text>
</svg>