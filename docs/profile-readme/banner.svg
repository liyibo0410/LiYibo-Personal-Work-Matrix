  <desc id="bannerDesc">浅色版横幅：姓名、求职方向、GitHub 地址，以及「10 模块 · 4 层 · 731 passed · 证据可复核」一行，右侧为四层模块的抽象图形。</desc>

  <!-- 底 + 面 -->
  <rect width="1280" height="300" fill="#F5F7FA"/>
  <rect x="24" y="24" width="1232" height="252" rx="16" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1"/>

  <!-- 左侧强调条 -->
  <rect x="64" y="90" width="4" height="104" rx="2" fill="#3370FF"/>

  <g font-family="'Microsoft YaHei','PingFang SC',Inter,-apple-system,'Segoe UI',sans-serif">
