    <text x="1216" y="120" font-size="20" text-anchor="end" fill="#5A6472">github.com/liyibo0410</text>

    <!-- 四层抽象图形：四条右对齐、逐层收窄的横条 -->
    <g fill="#3370FF">
      <rect x="956" y="152" width="260" height="8" rx="4" opacity="1"/>
      <rect x="1016" y="172" width="200" height="8" rx="4" opacity=".78"/>
      <rect x="1076" y="192" width="140" height="8" rx="4" opacity=".52"/>
      <rect x="1136" y="212" width="80" height="8" rx="4" opacity=".3"/>
    </g>
