[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false

[project]
name = "p07-ai-asset-center"
version = "0.1.0"
description = "AI 素材中心 - Li Yibo's Personal Portfolio 李奕波个人作品矩阵"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "httpx>=0.27.0",
    "portfolio-config",
    "llm-gateway",
]

[tool.uv.sources]
portfolio-config = { path = "../../shared/config", editable = true }
llm-gateway = { path = "../../shared/llm-gateway", editable = true }

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
