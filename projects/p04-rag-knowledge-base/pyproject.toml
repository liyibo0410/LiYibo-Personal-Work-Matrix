[project]
name = "knowledge-base"
version = "0.1.0"
description = "Add your description here"
requires-python = "==3.11.*"
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.138.0",
    "grandalf>=0.8",
    "langchain>=1.3.10",
    "langchain-openai>=1.3.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.6",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.0",
    "openai-agents>=0.18.3",
    "dashscope>=1.26.4",
    "uvicorn[standard]>=0.51.0",
    # 注意：不要添加 config / utils / processor / knowledge 这四个依赖。
    # 它们是 PyPI 上与本项目本地包同名的无关第三方包，安装后会与项目内的
    # config/、utils/、processor/ 目录抢 import，导致模块导入混乱。
    # 本地包通过项目根目录加入 sys.path 直接导入，无需声明为依赖。
    "ragas>=0.4.3",
    "pandas>=2.2.0",
    "datasets>=3.0.0",
]
[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
