<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库 · 文件导入</title>
    <style>
        :root {
            --primary: var(--cp-brand, #1D4ED8);
            --primary-hover: var(--cp-brand-hover, #245AE0);
            --primary-light: var(--cp-brand-bg, #E8F0FF);
            --bg: var(--cp-bg, #F5F7FA);
            --surface: var(--cp-surface, #FFFFFF);
            --elevated: var(--cp-elevated, #EEF1F6);
            --border: var(--cp-line, #DDE2EA);
            --text: var(--cp-ink1, #1A1F2B);
            --text-secondary: var(--cp-ink2, #5A6472);
            --text-muted: var(--cp-ink3, #8A94A3);
            --success: var(--cp-success, #16A34A);
            --success-bg: var(--cp-success-bg, #E7F6EC);
            --warning: var(--cp-warning, #B4690E);
            --warning-bg: var(--cp-warning-bg, #FDF1DC);
            --danger: var(--cp-danger, #D92D20);
            --danger-bg: var(--cp-danger-bg, #FEE9E7);
            --radius: 8px;
            --shadow: 0 1px 3px rgba(16,24,40,0.06), 0 0 0 1px rgba(16,24,40,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(16,24,40,0.08), 0 4px 6px -2px rgba(16,24,40,0.04);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--cp-line, #DDE2EA); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #C0C8D6; }
        .container {
            width: 100%;
            max-width: 800px;
        }
        /* 页头 */
        .header {
            margin-bottom: 32px;
            text-align: center;
        }
        .header-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--primary-light);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--primary);
            fill: none;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
        .header .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 卡片 */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        /* 上传区域 */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 56px 24px;
            text-align: center;
            cursor: pointer;
            background: var(--bg);
            transition: all 0.2s ease;
        }
        .upload-area:hover, .upload-area.dragover {
            background: var(--primary-light);
            border-color: var(--primary);
        }
        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--primary-light);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-icon svg {
            width: 32px;
            height: 32px;
            stroke: var(--primary);
            fill: none;
        }
        .upload-area p {
            font-size: 16px;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 8px;
        }
        .upload-area .hint {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .file-input { display: none; }

        /* 文件列表 */
        .file-list { margin-top: 8px; }
        .file-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.15s ease;
        }
        .file-item:hover {
            box-shadow: var(--shadow-lg);
        }
        .file-info { display: flex; flex-direction: column; flex: 1; margin-right: 20px; }
        .file-name { font-weight: 500; color: var(--text); font-size: 14px; }
        .file-size { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            min-width: 80px;
            text-align: center;
            color: #fff;
            flex-shrink: 0;
        }
        .status-uploading { background-color: var(--warning); }
        .status-processing { background-color: var(--primary); }
        .status-completed { background-color: var(--success); }
        .status-error { background-color: var(--danger); }
        .progress-bar-container {
            width: 100%; height: 4px;
            background-color: var(--bg);
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }
        .progress-bar { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s ease; }
        .log-details { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
        .log-details summary { cursor: pointer; user-select: none; color: var(--text-secondary); }
        .log-list { margin: 8px 0 0 16px; padding: 0; }
        .log-list li { margin: 3px 0; line-height: 1.5; }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
        }
        .empty-state-icon {
            width: 56px; height: 56px;
            margin: 0 auto 12px;
            border-radius: 14px;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center;
        }
        .empty-state-icon svg { width: 28px; height: 28px; stroke: var(--text-secondary); fill: none; }
        .empty-state p { font-size: 14px; }

        /* 底部提示 */
        .footer-hint {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 12px;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .file-item { animation: fadeIn 0.2s ease; }
    </style>
<link rel="icon" type="image/svg+xml" href="/shared/ui-kit/favicon.svg">
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        </div>
        <h1>知识库文件导入</h1>
        <div class="subtitle">上传 PDF 或 Markdown 文件，自动解析并入库</div>
    </div>

    <div class="card">
        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="12" y1="18" x2="12" y2="12"/>
                    <polyline points="9 15 12 12 15 15"/>
                </svg>
            </div>
            <p>点击或拖拽文件到此处</p>
            <div class="hint">支持 PDF / Markdown，多文件批量导入</div>
            <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md">
        </div>
    </div>

    <div id="fileList" class="file-list">
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">
                <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
            </div>
            <p>暂无上传文件</p>
        </div>
    </div>

    <div class="footer-hint">文件将自动解析并存储到知识库中</div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const emptyState = document.getElementById('emptyState');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

    function handleFiles(files) {
        Array.from(files).forEach(uploadFile);
    }

    function updateProgressBar(bar, pct) {
        bar.style.width = pct + '%';
    }

    function normalizeDoneLog(t) { return (typeof t === 'string' && t.endsWith('已完成')) ? t : `${t}已完成`; }
    function normalizeRunningLog(t) {
        if (typeof t !== 'string') return String(t);
        return t.startsWith('正在进行') ? (t.endsWith('...') ? t : `${t}...`) : `正在进行${t}...`;
    }

    async function uploadFile(file) {
        if (emptyState) emptyState.style.display = 'none';

        const id = 'file-' + Math.random().toString(36).substr(2, 9);
        const html = `
            <div class="file-item" id="${id}">
                <div class="file-info">
                    <span class="file-name"></span>
                    <span class="file-size"></span>
                    <div class="progress-bar-container"><div class="progress-bar"></div></div>
                    <details class="log-details"><summary>日志（点击展开）</summary><ul class="log-list"></ul></details>
                </div>
                <div class="status-badge status-uploading">上传中...</div>
            </div>`;
        fileList.insertAdjacentHTML('afterbegin', html);
        const itemEl = document.getElementById(id);
        itemEl.querySelector('.file-name').textContent = file.name;
        itemEl.querySelector('.file-size').textContent = (file.size / 1024).toFixed(2) + ' KB';
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const progressContainer = itemEl.querySelector('.progress-bar-container');

        const formData = new FormData();
        formData.append('files', file);
        try {
            progressContainer.style.display = 'block';
            updateProgressBar(progressBar, 50);
            const response = await fetch('/upload', { method: 'POST', body: formData });
            if (!response.ok) throw new Error('Upload failed');
            const result = await response.json();
            const taskId = result.task_ids[0];
            updateProgressBar(progressBar, 30);
            statusBadge.textContent = '处理中...';
            statusBadge.className = 'status-badge status-processing';
            pollStatus(taskId, itemEl);
        } catch (error) {
            console.error(error);
            statusBadge.textContent = '失败';
            statusBadge.className = 'status-badge status-error';
        }
    }

    function renderLogs(itemEl, doneList, runningList) {
        const logDetails = itemEl.querySelector('.log-details');
        const logSummary = itemEl.querySelector('.log-details summary');
        const logListEl = itemEl.querySelector('.log-list');
        const done = Array.isArray(doneList) ? doneList : [];
        const running = Array.isArray(runningList) ? runningList : [];
        logSummary.textContent = `日志（已完成${done.length}，进行中${running.length}，点击展开）`;
        logListEl.innerHTML = '';
        const lines = [...done.map(normalizeDoneLog), ...running.map(normalizeRunningLog)];
        if (lines.length === 0) {
            const li = document.createElement('li'); li.textContent = '暂无日志'; logListEl.appendChild(li);
        } else {
            lines.forEach(line => { const li = document.createElement('li'); li.textContent = line; logListEl.appendChild(li); });
        }
        if (lines.length === 0) logDetails.open = false;
    }

    function pollStatus(taskId, itemEl) {
        const statusBadge = itemEl.querySelector('.status-badge');
        const progressBar = itemEl.querySelector('.progress-bar');
        const interval = setInterval(async () => {
            try {
                const res = await fetch(`/status/${taskId}`);
                const data = await res.json();
                renderLogs(itemEl, data.done_list, data.running_list);
                if (data.status === 'completed') {
                    statusBadge.textContent = '已完成';
                    statusBadge.className = 'status-badge status-completed';
                    updateProgressBar(progressBar, 100);
                    clearInterval(interval);
                } else if (data.status === 'processing') {
                    statusBadge.textContent = '处理中...';
                    updateProgressBar(progressBar, 30);
                } else if (data.status === 'failed') {
                    statusBadge.textContent = '失败';
                    statusBadge.className = 'status-badge status-error';
                    clearInterval(interval);
                }
            } catch (e) { console.error('Polling error', e); }
        }, 2000);
    }
</script>

</body>
</html>
