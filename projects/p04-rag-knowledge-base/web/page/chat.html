<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>RAG 知识库</title>
  <!-- 统一设计系统：tokens.css 是配色唯一真源；services.js + ui-kit.js 提供注册表、主题与品牌位桥接 -->
  <link rel="stylesheet" href="/shared/ui-kit/tokens.css">
  <script src="/shared/config/services.js"></script>
  <script src="/shared/ui-kit/ui-kit.js"></script>
  <!-- Markdown 渲染 -->
  <!-- 第三方库一律走本机 /shared/vendor：外链 CDN 实测首屏要等 3~9 秒，断网即白屏 -->
  <script src="/shared/vendor/marked.min.js"></script>
  <!-- 代码高亮：CSS 改为非渲染阻塞（media=print 加载完切回 all），JS 加 defer；
       二者都非首屏必需，且有 typeof hljs 守卫，延迟加载不影响功能，仅首屏更快。
       注：marked（Markdown）与 ui-kit 维持解析阻塞，因其首屏即被使用且体积极小。 -->
  <link rel="stylesheet" href="/shared/vendor/highlight/github-dark.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/shared/vendor/highlight/github-dark.min.css"></noscript>
  <script src="/shared/vendor/highlight/highlight.min.js" defer></script>
  <style>
    :root{
      --bg:var(--cp-bg, #F5F7FA);
      --panel:var(--cp-surface, #FFFFFF);
      --elevated:var(--cp-elevated, #EEF1F6);
      --text:var(--cp-ink1, #1A1F2B);
      --muted:var(--cp-ink2, #5A6472);
      --text-muted:var(--cp-ink3, #8A94A3);
      --brand:var(--cp-brand, #1D4ED8);
      --brand2:var(--cp-brand, #1D4ED8);
      --bubble-user:var(--cp-brand, #1D4ED8);
      --bubble-bot:var(--cp-elevated, #EEF1F6);
      --border:var(--cp-line, #DDE2EA);
      --primary-bg:var(--cp-brand-bg, #E8F0FF);
      --success:var(--cp-success, #16A34A);
      --success-bg:var(--cp-success-bg, #E7F6EC);
      --warning:var(--cp-warning, #B4690E);
      --warning-bg:var(--cp-warning-bg, #FDF1DC);
      --danger:var(--cp-danger, #D92D20);
      --danger-bg:var(--cp-danger-bg, #FEE9E7);
      --shadow:0 10px 30px rgba(16,24,40,0.08);
    }
    *{box-sizing:border-box}
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--cp-line, #DDE2EA); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #C0C8D6; }
    body{
      margin:0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background: var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }
    .app{
      width:100%;
      max-width:980px;
      height:min(820px, 92vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid var(--border);
      /* 规范禁止渐变装饰底（02-技术规范·前端侧），改用扁平品牌弱底 */
      background:var(--primary-bg);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .logo{
      width:36px;height:36px;border-radius:10px;
      background:var(--brand);
    }
    .title{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .title strong{font-size:14px; color: var(--text);}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}
    .top-actions{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      background:var(--panel);
    }
    /* 依赖降级（例如向量库没起、问答链路实际不可用）必须显出来，不能只报「已连接」 */
    .pill-warn{
      color:var(--danger);
      border-color:var(--danger);
      background:var(--danger-bg);
    }
    .btn{
      border:none;
      background:var(--brand);
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      font-size:12px;
      cursor:pointer;
    }
    .btn:hover{background:var(--brand2)}
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .chat{
      flex:1;
      overflow:auto;
      padding:16px 14px 10px;
      background:var(--panel);
    }
    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:6px 0 14px;
    }
    .msg{
      display:flex;
      gap:10px;
      margin:10px 0;
      align-items:flex-end;
    }
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){
      flex:1;
      min-width:0;
    }
    .msg.user > div:not(.avatar){
      display:flex;
      flex-direction:column;
      align-items:flex-end;
    }
    .avatar{
      width:34px;height:34px;border-radius:10px;
      background:var(--bg);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;
      color:var(--text);
      flex:0 0 auto;
    }
    .avatar.bot{background:var(--brand); color: #fff;}
    .bubble{
      max-width:min(720px, 76%);
      display:inline-block;
      border-radius:14px;
      padding:10px 12px;
      border:1px solid var(--border);
      background:var(--bubble-bot);
      position:relative;
      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap: break-word;
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border-color:transparent;
    }
    /* Markdown 内容样式 */
    .bubble .markdown-content{
      white-space: normal;
    }
    .bubble .markdown-content h1,
    .bubble .markdown-content h2,
    .bubble .markdown-content h3,
    .bubble .markdown-content h4{
      margin: 12px 0 8px;
      font-weight: 600;
    }
    .bubble .markdown-content h1{ font-size: 18px; }
    .bubble .markdown-content h2{ font-size: 16px; }
    .bubble .markdown-content h3{ font-size: 15px; }
    .bubble .markdown-content p{
      margin: 8px 0;
    }
    .bubble .markdown-content ul,
    .bubble .markdown-content ol{
      margin: 8px 0;
      padding-left: 24px;
    }
    .bubble .markdown-content li{
      margin: 4px 0;
    }
    .bubble .markdown-content code{
      background: rgba(16,24,40,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
    }
    .bubble .markdown-content pre{
      background: #0D1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .bubble .markdown-content pre code{
      background: transparent;
      padding: 0;
    }
    .bubble .markdown-content table{
      border-collapse: collapse;
      margin: 10px 0;
      width: 100%;
    }
    .bubble .markdown-content th,
    .bubble .markdown-content td{
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .bubble .markdown-content th{
      background: var(--elevated);
      font-weight: 600;
    }
    .bubble .markdown-content blockquote{
      border-left: 4px solid var(--brand);
      margin: 10px 0;
      padding: 8px 16px;
      background: rgba(51,112,255,0.08);
      color: var(--muted);
    }
    .bubble .markdown-content img{
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 10px 0;
    }
    .bubble .markdown-content a{
      color: var(--brand);
      text-decoration: none;
    }
    .bubble .markdown-content a:hover{
      text-decoration: underline;
    }
    .meta{
      font-size:11px;
      color:var(--muted);
      margin-top:6px;
    }
    .msg.user .meta{color:rgba(255,255,255,.7)}
    details.progress{
      margin-top:8px;
      border:1px dashed var(--border);
      border-radius:12px;
      padding:8px 10px;
      background:var(--bg);
    }
    details.progress summary{
      cursor:pointer;
      user-select:none;
      color:var(--muted);
      font-size:12px;
    }
    .progress ul{margin:8px 0 0 18px;padding:0}
    .progress li{margin:4px 0;font-size:12px;color:var(--muted)}

    .answer-images{
      margin-top:10px;
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
      gap:10px;
    }
    .answer-image{
      display:block;
      text-decoration:none;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--panel);
      padding:6px;
    }
    .answer-image:hover{border-color:var(--brand);}
    .answer-image img{
      display:block;
      width:100%;
      height:110px;
      object-fit:contain;
      border-radius:6px;
      background:var(--elevated);
    }
    .answer-image-cap{
      display:block;
      margin-top:4px;
      font-size:12px;
      line-height:1.35;
      color:var(--muted);
    }
    .answer-image.is-broken img{display:none;}
    .answer-image.is-broken .answer-image-cap{color:var(--text);}

    .typing{
      display:inline-flex;gap:6px;align-items:center;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--muted);
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.6}
      40%{transform:translateY(-5px);opacity:1}
    }

    .composer{
      border-top:1px solid var(--border);
      padding:12px 14px;
      display:flex;
      gap:10px;
      align-items:flex-end;
      background:var(--panel);
    }
    textarea{
      flex:1;
      resize:none;
      min-height:44px;
      max-height:140px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      outline:none;
      font-size:14px;
      line-height:1.5;
      background:var(--bg);
      color:var(--text);
    }
    textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px rgba(51,112,255,0.2)}
    .send{
      width:88px;
      height:44px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      color:#fff;
      background:var(--brand);
    }
    .send:hover{background:var(--brand2)}
    .send:disabled{opacity:.6;cursor:not-allowed}
    .hint{
      padding:0 14px 12px;
      color:var(--muted);
      font-size:12px;
      background:var(--panel);
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:6px;
      background:var(--bg);
      color:var(--text);
    }
    .sources-bar{margin-top:10px;padding:8px 12px;background:var(--elevated);border:1px solid var(--border);border-radius:8px;font-size:13px;}
    .sources-bar summary{cursor:pointer;font-weight:600;color:var(--brand);list-style:none;display:flex;align-items:center;gap:6px;}
    .sources-bar summary::before{content:'📄';font-size:14px;}
    /* 拒答态：系统如实拒绝作答时给出原因与下一步，文字用 --text 保证在弱底上对比度达标，
       琥珀色只作左边框与标签点，不承担文字色 */
    .refusal-note{margin-top:10px;padding:8px 12px;background:var(--warning-bg);border-left:3px solid var(--warning);border-radius:6px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
    .refusal-tag{font-size:12px;font-weight:600;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:2px 10px;}
    .refusal-tip{font-size:12.5px;color:var(--text);}
    .source-item{padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .source-item:last-child{border-bottom:none;}
    .source-title{color:var(--text);font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .source-score{color:var(--muted);font-size:12px;margin-left:8px;flex-shrink:0;}
    .source-preview{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:400px;}
    .feedback-bar{margin-top:8px;display:flex;gap:8px;align-items:center;}
    .feedback-btn{border:1px solid var(--border);background:var(--panel);border-radius:20px;padding:4px 14px;cursor:pointer;font-size:14px;transition:all .2s;color:var(--text);}
    .feedback-btn:hover{background:var(--elevated);border-color:#C0C8D6;}
    .feedback-btn.active-up{background:var(--success-bg);border-color:var(--success);color:var(--success);}
    .feedback-btn.active-down{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
    .feedback-label{font-size:12px;color:var(--muted);}

    /* 窄屏（手机 / 侧栏 iframe）适配：原先 .brand 写死 min-width:240px、机器人消息骨架写死
       min-width:180px（内联样式会盖掉 .msg>div 的 min-width:0），在 ~320px 视口下会把
       「流式输出」「李奕波个人作品矩阵」挤成逐字竖排。这里改为头部换行 + 让列宽可收缩。 */
    @media (max-width:640px){
      body{padding:0;align-items:stretch;height:100dvh}
      .app{max-width:none;height:100dvh;border:none;border-radius:0;box-shadow:none}
      .topbar{flex-wrap:wrap;gap:8px 12px;padding:10px 12px}
      .top-actions{margin-left:0;width:100%;flex-wrap:wrap;gap:8px}
      .chat{padding:12px 10px 8px}
      .msg{gap:8px}
      .avatar{width:30px;height:30px;font-size:10px;line-height:1.05;text-align:center;overflow:hidden}
      .source-preview{max-width:100%}
      .answer-images{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    }
  </style>

<body class="cp-app" data-cp-module="p04" data-cp-brand-src="/shared/config/brand.json">
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo cp-brandmark" data-cp-brand="logo">YD</div>
        <div class="title">
          <strong>RAG 知识库</strong>
          <span id="subTitle">在线 · 可查询知识库与联网信息</span>
        </div>
      </div>
      <div class="top-actions">
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:var(--muted);margin-right:10px;">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" data-cp-brand="company">李奕波个人作品矩阵</span>
        <span class="pill" id="apiPill">API: 未连接</span>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">RAG 知识库</div>
        <div>
          <div class="bubble">你好，我是RAG 知识库客服。你可以直接提问，我会在"阶段进度"里展示处理过程。</div>
          <div class="meta">提示：可以问"如何使用万用表测量电压？"</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

  <script>
    const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }

    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      if(!s) return '';
      return s.replace(/\s/g, '%20');
    }

    function dedupeKeepOrder(arr){
      const seen = new Set();
      const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v) continue;
        if(seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }

    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const matches = s.match(regex) || [];
      const urls = [];
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
      for(const m of matches){
        let u = trimHeadPunct(trimTailPunct(m));
        if(u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }

    function parseImagesFromTextLoosely(text){
      const urls = extractUrlsLoose(text).filter(isImageUrl);
      return dedupeKeepOrder(urls);
    }

    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m;
      let lastIdx = -1;
      let lastLen = 0;
      while((m = re.exec(s)) !== null){
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }

    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };
      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')){
          urls.push(line);
        }else{
          const matches = extractUrlsLoose(line);
          for(const u of matches){ urls.push(u); }
        }
      }
      const seen = new Set();
      const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized)) continue;
        if(seen.has(normalized)) continue;
        seen.add(normalized);
        images.push(normalized);
      }
      return { text: before, images };
    }

    function shouldShowImagesByAnswer(answerText){
      const t = String(answerText || '');
      const keywords = ['如图', '如下图', '见图', '见下图', '下图', '上图', '图片', '示意图', '结构图', '外观', '接线图', '电路图', '原理图', '安装图', '尺寸图', '截图'];
      return keywords.some(k => t.includes(k));
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls) ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl) : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      const shouldShow = hasBlockImages || (candidates.length > 0) || (looseImages.length > 0);
      const allImages = new Set([...(hasBlockImages ? imagesFromBlock : []), ...candidates, ...looseImages]);
      const images = Array.from(allImages);
      containerEl.textContent = '';
      if((text || '').trim().length > 0){
        const textEl = document.createElement('div');
        textEl.className = 'answer-text markdown-content';
        // 使用 marked 渲染 Markdown
        if(typeof marked !== 'undefined'){
          marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: false,
            mangle: false,
          });
          textEl.innerHTML = marked.parse(text);
          // 代码高亮
          textEl.querySelectorAll('pre code').forEach((block) => {
            if(typeof hljs !== 'undefined'){
              hljs.highlightElement(block);
            }
          });
        }else{
          textEl.textContent = text;
        }
        containerEl.appendChild(textEl);
      }else{
        const textEl = document.createElement('div');
        textEl.className = 'answer-text';
        textEl.textContent = '（已完成，但未返回答案）';
        containerEl.appendChild(textEl);
      }
      // 拒答时不渲染配图：image_urls 来自召回切片，既然已如实回答「文档里没有这条信息」，
      // 再端一排图等于把证据又摆回去了，视觉上自相矛盾。
      if(images && images.length > 0 && !detectRefusal(text)){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        images.forEach(function(url, i){
          const safeUrl = normalizeUrl(url);
          const fig = document.createElement('a');
          fig.className = 'answer-image';
          fig.href = safeUrl;
          fig.target = '_blank';
          fig.rel = 'noopener noreferrer';
          fig.title = safeUrl;
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片 ' + (i + 1);
          img.referrerPolicy = 'no-referrer';
          const cap = document.createElement('span');
          cap.className = 'answer-image-cap';
          cap.textContent = '图 ' + (i + 1);
          // 图片地址指向 MinIO（localhost:9000），换机/远程访问会取不到；
          // 失败时不静默隐藏，改成说明文字 + 仍可点开原图，避免「答案里有图但用户什么都没看见」。
          img.addEventListener('error', () => {
            fig.classList.add('is-broken');
            cap.textContent = '图 ' + (i + 1) + ' · 原图不可达（图片存于 MinIO，点击可重试）';
          });
          fig.appendChild(img);
          fig.appendChild(cap);
          imgWrap.appendChild(fig);
        });
        containerEl.appendChild(imgWrap);
      }
    }

    // 拒答态识别。后端口径的唯一实现在 utils/refusal_utils.py（实体层 / 证据层 / 生成层三层），
    // 这里只镜像它的两条固定句式与一个固定标记；对开放式措辞（「并未提及」等）额外要求同一句里
    // 出现「参考内容 / 文中 / 手册 / 文档 / 知识库」这类依据词，免得把正常答案里顺带的「未说明」标成拒答。
    const REFUSAL_EVIDENCE_TEXT = '未检索到与该问题相关的内容';
    const REFUSAL_ENTITY_TEXT = '未找到相关产品';
    const REFUSAL_MARKER = '【知识库未记载】';
    function detectRefusal(answer){
      const text = (answer || '').trim();
      if(!text) return null;
      if(text.indexOf(REFUSAL_EVIDENCE_TEXT) !== -1){
        return {tag:'未找到依据', tip:'知识库里没有召回到相关内容，换个说法或补上产品型号再问一次。'};
      }
      if(text.indexOf(REFUSAL_ENTITY_TEXT) !== -1){
        return {tag:'库内无此产品', tip:'当前知识库没有该产品的文档，可在「上传导入」里先把手册入库。'};
      }
      if(text.indexOf(REFUSAL_MARKER) !== -1){
        return {tag:'手册未记载', tip:'文档里没有这条信息，系统不作推测。'};
      }
      const head = text.slice(0, 120);
      if(/(未提及|未记载|未包含|未说明|未给出|没有提及|没有包含)/.test(head)
        && /(参考内容|文中|手册|文档|知识库)/.test(head)){
        return {tag:'手册未记载', tip:'文档里没有这条信息，系统不作推测。'};
      }
      return null;
    }

    function appendRefusalNote(botMsgEl, answer){
      const bubble = botMsgEl.querySelector('.bubble');
      if(!bubble) return;
      bubble.querySelector('.refusal-note') && bubble.querySelector('.refusal-note').remove();
      const refusal = detectRefusal(answer);
      if(!refusal) return;
      const note = document.createElement('div');
      note.className = 'refusal-note';
      const tag = document.createElement('span');
      tag.className = 'refusal-tag';
      tag.textContent = refusal.tag;
      const tip = document.createElement('span');
      tip.className = 'refusal-tip';
      tip.textContent = refusal.tip;
      note.appendChild(tag);
      note.appendChild(tip);
      bubble.appendChild(note);
    }

    function renderSources(botMsgEl, sources) {
      if (!sources || sources.length === 0) return;
      const bubble = botMsgEl.querySelector('.bubble');
      if (!bubble) return;
      let bar = bubble.querySelector('.sources-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.className = 'sources-bar';
        bubble.appendChild(bar);
      }
      let html = '<details><summary>参考来源 (' + sources.length + ')</summary><div class="source-list">';
      sources.forEach(function(s) {
        const title = s.file_title || s.title || '未知来源';
        const score = s.score ? (s.score * 100).toFixed(1) + '%' : '';
        const preview = s.content_preview || '';
        html += '<div class="source-item"><div><div class="source-title">' + escapeHtml(title) + '</div>';
        if (preview) html += '<div class="source-preview">' + escapeHtml(preview) + '</div>';
        html += '</div>';
        if (score) html += '<span class="source-score">' + score + '</span>';
        html += '</div>';
      });
      html += '</div></details>';
      bar.innerHTML = html;
    }

    function renderFeedback(botMsgEl, sessionId) {
      const bubble = botMsgEl.querySelector('.bubble');
      if (!bubble || bubble.querySelector('.feedback-bar')) return;
      const msgId = botMsgEl.id || ('msg-' + Date.now());
      botMsgEl.id = msgId;
      const bar = document.createElement('div');
      bar.className = 'feedback-bar';
      bar.innerHTML = '<span class="feedback-label">这个回答有帮助吗？</span>' +
        '<button class="feedback-btn" data-type="up" title="有帮助">👍</button>' +
        '<button class="feedback-btn" data-type="down" title="没帮助">👎</button>';
      bubble.appendChild(bar);
      bar.querySelectorAll('.feedback-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const type = btn.dataset.type;
          bar.querySelectorAll('.feedback-btn').forEach(function(b) { b.classList.remove('active-up', 'active-down'); });
          btn.classList.add(type === 'up' ? 'active-up' : 'active-down');
          fetch(API_BASE + '/feedback', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({session_id: sessionId, message_id: msgId, feedback: type})
          }).catch(function(){});
        });
      });
    }

    function addUserMsg(text){
      const html = `<div class="msg user"><div><div class="bubble">${escapeHtml(text)}</div><div class="meta">${nowTime()}</div></div><div class="avatar">我</div></div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts){
      const html = `<div class="msg user"><div><div class="bubble">${escapeHtml(text)}</div><div class="meta">${formatTime(ts)}</div></div><div class="avatar">我</div></div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `<div class="msg bot" id="${id}"><div class="avatar bot">RAG 知识库</div><div><div class="bubble"><div class="answer"></div></div><div class="meta">${formatTime(ts)}</div></div></div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if(el){
        const answerEl = el.querySelector('.answer');
        renderAnswerWithImages(answerEl, text || '', imageUrls || []);
        appendRefusalNote(el, text);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `<div class="msg bot" id="${id}"><div class="avatar bot">RAG 知识库</div><div><div class="bubble"><span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span><details class="progress" open><summary>阶段进度（等待中）</summary><ul></ul></details></div><div class="meta">${nowTime()}</div></div></div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;
      const statusMap = {'processing': '处理中', 'completed': '已完成', 'failed': '失败', 'pending': '等待中'};
      const displayStatus = statusMap[status] || status || 'unknown';
      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;
      const lines = [...done.map(x => `✅ ${x}`), ...running.map(x => `⏳ ${x}`)];
      ul.innerHTML = '';
      if(lines.length === 0){ ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>'); }
      else{ for(const line of lines){ ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`); } }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();
      if(err){
        if(progress) { progress.remove(); progress.removeAttribute('open'); }
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        if(progress) bubble.appendChild(progress);
        return;
      }
      if(progress) { progress.remove(); progress.removeAttribute('open'); }
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      appendRefusalNote(botMsgEl, answer);
      if(progress) bubble.appendChild(progress);
    }

    async function apiHealth(){
      // /health 现在会如实回报依赖状态：进程活着但 Milvus 离线时，问答是跑不通的，
      // 不能再显示成「已连接」。降级信息来自响应的 query_ready / conclusion。
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        const data = await res.json().catch(() => ({}));
        if(data.query_ready === false){
          const missing = Array.isArray(data.missing_for_query) ? data.missing_for_query.join('/') : '';
          apiPill.textContent = `API: 已连接，依赖缺失(${missing || '未知'}) → 问答不可用`;
          apiPill.classList.add('pill-warn');
          return;
        }
        apiPill.textContent = `API: 已连接`;
        apiPill.classList.remove('pill-warn');
      }catch(e){ apiPill.textContent = `API: 未连接`; apiPill.classList.add('pill-warn'); }
    }

    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user'){ addUserMsgWithTime(item.text || '', item.ts); }
          else{ addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []); }
        }
        scrollToBottom();
      }catch(_){}
    }

    async function submitQuery(text){
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ query: text, session_id: sessionId, is_stream: isStream })
      });
      if(!res.ok){
        const msg = await res.text();
        // 502 时 nginx 会回整页 HTML —— 直接抛给气泡会把整段 HTML 贴出来（2026-10-15 实测）
        const clean = /<\s*html|<!doctype/i.test(msg)
          ? ('服务暂时不可用（HTTP ' + res.status + '）')
          : (msg || '请求失败');
        throw new Error(clean);
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl){
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try{
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);
          if(data.status === 'completed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }else if(data.status === 'failed'){
            if(typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        }catch(e){}
      }, 1200);
    }

    async function onSend(){
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;
      // 冷启动 UX 缓解：首次（或长时间空闲后）检索需加载本地嵌入/重排模型，首条响应明显变慢。
      // 若 4 秒内仍停在「等待中」无阶段进度事件，提示访客模型预热中，避免误以为卡死；
      // 一旦进度事件到达，renderProgress 会改写 summary 文本，提示自然消失。
      const coldHint = setTimeout(() => {
        const det = botMsgEl.querySelector('details.progress');
        const sum = det && det.querySelector('summary');
        if (sum && /等待中/.test(sum.textContent) && !/预热/.test(sum.textContent)) {
          sum.textContent += '（首次检索需加载本地嵌入/重排模型，实测最长约 40 秒，请稍候）';
        }
      }, 4000);
      try{
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);
        renderProgress(botMsgEl, [], [], 'pending');
        if (!isStream) {
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          renderSources(botMsgEl, data.sources || []);
          renderFeedback(botMsgEl, sessionId);
          sendBtn.disabled = false;
          return;
        }
        const { session_id } = data;
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }
        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        let rawAnswerText = '';
        // 最后一次 progress 事件里的已完成阶段：收尾时用它把「状态：处理中」改成已完成，
        // 否则答案都出来了进度条还挂着 ⏳ 某阶段（后端不会再为收尾补发 progress 事件）。
        let lastDoneList = [];
        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            if(Array.isArray(d.done_list)) lastDoneList = d.done_list;
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d && d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          }catch(_){}
        });
        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if(delta){
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          }catch(_){}
        });
        es.addEventListener('final', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
            appendRefusalNote(botMsgEl, finalText);
            renderSources(botMsgEl, d.sources || []);
            renderFeedback(botMsgEl, session_id);
          }catch(_){}
          renderProgress(botMsgEl, lastDoneList, [], 'completed');
          es.close();
          sendBtn.disabled = false;
        });
        es.addEventListener('final_answer', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
            appendRefusalNote(botMsgEl, finalText);
            renderSources(botMsgEl, d.sources || []);
            renderFeedback(botMsgEl, session_id);
          }catch(_){}
          renderProgress(botMsgEl, lastDoneList, [], 'completed');
          es.close();
          sendBtn.disabled = false;
        });
        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          try{
            const msg = e && e.data ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){
            rawAnswerText += `\n\n（错误：SSE 连接中断/失败）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          renderProgress(botMsgEl, lastDoneList, [], 'failed');
          es.close();
          sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        clearTimeout(coldHint);
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}\n\n` + progress.outerHTML;
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); onSend(); }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;
      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if(!res.ok) { console.error("Failed to clear history backend, status:", res.status); alert('服务端清空失败，仅清空本地显示'); }
      } catch(e) { console.error("Failed to clear history backend", e); alert('服务端清空失败，仅清空本地显示'); }
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
