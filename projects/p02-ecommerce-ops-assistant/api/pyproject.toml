[project]
name = "ecommerce-operation-assistant-api"
version = "0.1.0"
description = "FastAPI backend for Ecommerce Operation Assistant."
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "celery[redis]",
  "cryptography",
  "fastapi",
  "httpx",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "llm-gateway",
  "opentelemetry-api",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-sdk",
  "pillow",
  "psycopg[binary,pool]",
  "pydantic-settings",
  "pymysql",
  "python-multipart",
  "sqlalchemy",
  "uvicorn[standard]",
]

[tool.uv.sources]
llm-gateway = { path = "../../../shared/llm-gateway", editable = true }

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
