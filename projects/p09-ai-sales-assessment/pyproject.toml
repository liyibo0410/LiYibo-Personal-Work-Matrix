[project]
name = "p09-ai-sales-assessment"
version = "1.0.0"
description = "AI Sales Assessment - Quality inspection and performance scoring for customer service conversations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "cloudpivot-config",
]

[tool.uv.sources]
cloudpivot-config = { path = "../../shared/config", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
